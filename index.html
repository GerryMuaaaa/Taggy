<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ee">
<title>TAGGY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Bitter = reemplazo de Kefa III (títulos) · Inter = reemplazo de Galvji (cuerpo) · Chewy = solo para el logo de respaldo -->
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Chewy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  /* Paleta de marca */
  --coral:#e38b70; --yellow:#fcd35c; --blue:#a9cad9; --pink:#fbdad1; --orange:#f09200; --green:#b6c6a8;
  --cream:#fff8ee; --ink:#231f20; --muted:#6f6660; --line:#eadfce; --white:#fff;
  --font-title:'Kefa','Kefa III','Bitter',Georgia,serif;
  --font-body:'Galvji','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#efe3d0}
body{font-family:var(--font-body);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,.title-font{font-family:var(--font-title);font-weight:800}
.app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--cream);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(35,31,32,.12)}
.screen{flex:1;padding:6px 16px 28px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:40px 24px;min-height:60vh}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;position:sticky;top:0;background:var(--cream);z-index:5}
.topbar .back{width:34px;height:34px;border-radius:50%;background:var(--white);font-size:16px}
.logo{height:30px;display:block}
.logo-text{font-family:'Chewy',cursive;font-size:30px;color:var(--orange);line-height:1}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-size:15px}
.avatar:active{transform:scale(.94)}

/* Bottom nav */
.nav{position:sticky;bottom:0;display:flex;background:var(--white);border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px}
.nav button .i{font-size:20px;filter:grayscale(1);opacity:.7}
.nav button.active{color:var(--ink)}
.nav button.active .i{filter:none;opacity:1}
.nav button.active span:last-child{border-bottom:3px solid var(--orange);padding-bottom:1px}

/* Cards, chips */
.card{background:var(--white);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
.sec-title{font-family:var(--font-title);font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--orange)}
h1{font-size:24px;line-height:1.15;margin-top:4px}
.sub{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--blue)}
.chip.green{background:var(--green)} .chip.yellow{background:var(--yellow)} .chip.pink{background:var(--pink)} .chip.coral{background:var(--coral)} .chip.orange{background:var(--orange)}
.chip .x{margin-left:2px;font-weight:800;opacity:.7}
.row{display:flex;gap:10px} .row>*{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* Pets screen */
.switcher{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.switcher::-webkit-scrollbar{display:none}
.switcher button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--white);font-weight:600;font-size:12px;border:2px solid transparent}
.switcher button.on{border-color:var(--orange);background:var(--yellow)}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--white) 45%,var(--pink));border-radius:28px;padding:18px;margin-bottom:14px}
.hero h2{font-size:24px;display:flex;gap:6px;align-items:center}
.pet-av{border-radius:50%;object-fit:cover;background:var(--pink);display:grid;place-items:center;overflow:hidden;flex-shrink:0;border:3px solid var(--white);box-shadow:0 4px 12px rgba(35,31,32,.15)}
.pet-av.lg{width:90px;height:90px;font-size:44px} .pet-av.md{width:112px;height:112px;font-size:56px} .pet-av.sm{width:42px;height:42px;font-size:22px;border-width:2px}
.pet-av img{width:100%;height:100%;object-fit:cover}
.pet-av.ill img{width:80%;height:80%;object-fit:contain}
.shield{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--blue);border-radius:999px;padding:12px 14px;font-weight:700;margin-bottom:18px}
.shield .ic{width:30px;height:30px;border-radius:50%;background:var(--white);display:grid;place-items:center}
.shield.lost{background:var(--coral)}
.shield small{display:block;font-weight:500;font-size:11px}
.shield .switch{margin-left:auto}
.quick-title{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--muted);margin-bottom:10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.quick button{background:var(--white);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;box-shadow:0 2px 0 var(--line)}
.quick button:active{transform:translateY(1px)}
.quick .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px}
.quick button:nth-child(1) .ic{background:var(--yellow)} .quick button:nth-child(2) .ic{background:var(--blue)} .quick button:nth-child(3) .ic{background:var(--pink)}
.nfc{background:linear-gradient(180deg,var(--white),var(--pink));border-radius:28px;padding:26px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
.nfc-wrap{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(252,211,92,.7) 0,rgba(252,211,92,.25) 55%,transparent 72%)}
.nfc-btn{width:132px;height:132px;border-radius:50%;background:var(--orange);border:6px solid var(--white);box-shadow:0 10px 28px rgba(240,146,0,.5);font-family:var(--font-title);font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pulse 2.4s infinite}
.nfc-btn small{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:1px}
.nfc-btn:active{transform:scale(.96)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,146,0,.45)}70%{box-shadow:0 0 0 26px rgba(240,146,0,0)}100%{box-shadow:0 0 0 0 rgba(240,146,0,0)}}
.nfc-note{background:var(--white);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:600;text-align:center}

/* Health */
.pet-head{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:20px;padding:10px 12px;margin-bottom:14px}
.pet-head .name{font-family:var(--font-title);font-weight:800;font-size:16px}
.share{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--blue);font-size:15px}
.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filters button{padding:6px 12px;border-radius:999px;background:var(--white);font-size:12px;font-weight:600;white-space:nowrap}
.filters button.on{background:var(--ink);color:var(--cream)}
.rec{background:var(--white);border-radius:20px;padding:14px;margin-bottom:12px;position:relative}
.rec.alert{background:var(--pink);border:2px solid var(--coral)}
.rec .tag{font-size:10px;font-weight:800;letter-spacing:.4px}
.rec .date{font-size:11px;color:var(--muted);text-align:right}
.rec h3{font-size:16px;margin:4px 0}
.rec p{font-size:12px;color:var(--muted);line-height:1.45}
.rec .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rec .tools{display:flex;gap:8px;margin-top:10px}
.mini-btn{font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--cream)}
.mini-btn.del{background:var(--pink)}
.fab{width:100%;margin-top:4px}

/* Forms */
.live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--orange)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.tabs{display:flex;background:var(--white);border-radius:999px;padding:4px;margin:14px 0}
.tabs button{flex:1;padding:9px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button.active{background:var(--orange);color:var(--ink);font-weight:700}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}
.input{width:100%;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:14px;outline:none}
.input:focus{border-color:var(--orange)}
.input.err{border-color:var(--coral);background:var(--pink)}
textarea.input{min-height:76px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.opt span:first-child{font-size:22px}
.opt.on{background:var(--yellow);border-color:var(--orange)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--cream);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:8px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--blue);color:var(--ink)}
.switch-row{display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:14px}
.switch-row b{font-size:13px;display:block} .switch-row small{font-size:11px;color:var(--muted);display:block;line-height:1.35}
.switch{margin-left:auto;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.2s;display:inline-block}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--white);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--orange)} .switch.on::after{left:23px}
.traits{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.add-row{display:flex;gap:8px}
.photo-card{text-align:center}
.cam{position:relative;display:inline-block;cursor:pointer}
.cam::after{content:"📷";position:absolute;right:0;bottom:4px;background:var(--orange);width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;border:2px solid var(--white)}
.btn{display:block;width:100%;padding:14px;border-radius:999px;font-weight:700;font-size:14px;text-align:center;text-decoration:none}
.btn.primary{background:var(--orange);color:var(--ink);box-shadow:0 5px 0 #b86f00}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b86f00}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.yellow{background:var(--yellow)}
.btn.ghost{background:var(--white);border:2px solid var(--line)}
.btn.danger{background:var(--coral)}
.btn+.btn{margin-top:12px}
.info{font-size:11px;color:var(--muted);text-align:center;margin:12px 0}
.link-red{display:block;text-align:center;font-size:12px;color:#b4472b;font-weight:700;margin:10px auto;text-decoration:underline}
.notice{background:var(--yellow);border-radius:18px;padding:12px;display:flex;gap:10px;font-size:12px;margin-bottom:14px;line-height:1.4}
.notice b{display:block;font-family:var(--font-title);font-size:14px}
.owner{display:flex;gap:14px;align-items:center}
.owner .pic{width:80px;height:80px;border-radius:50%;background:var(--coral);display:grid;place-items:center;font-size:36px;flex-shrink:0}
.phone-row{display:flex;gap:8px} .phone-row .prefix{width:76px;flex-shrink:0;text-align:center;background:var(--line)}
.cotutor{display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.cotutor .ic{width:34px;height:34px;border-radius:10px;background:var(--pink);display:grid;place-items:center}
.cotutor b{font-size:13px;display:block} .cotutor small{font-size:11px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Public profile */
.pub{background:var(--cream);min-height:100dvh}
.pub .banner{padding:18px 16px;text-align:center;font-family:var(--font-title);font-weight:800;font-size:18px;background:var(--green)}
.pub .banner.lost{background:var(--coral)}
.pub .who{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 16px 6px}
.pub .who h1{font-size:30px}
.pub .actions{display:grid;gap:12px;margin:6px 0 14px}
.pub .foot{text-align:center;padding:14px;font-size:11px;color:var(--muted)}

/* Modal / toast */
.overlay{position:fixed;inset:0;background:rgba(35,31,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{background:var(--cream);width:100%;max-width:430px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;animation:up .2s}
.sheet h3{font-size:18px;margin-bottom:12px}
.sheet .row{margin-top:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.qr{display:flex;justify-content:center;background:var(--white);border-radius:18px;padding:16px;margin:10px 0}
.qr canvas,.qr img{max-width:100%;height:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:100;max-width:90%;text-align:center;animation:up .2s}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty img{width:140px;margin-bottom:10px}
/* Recompensa + mapa */
.row>.btn+.btn{margin-top:0}
.card.reward{border:2px dashed var(--yellow)}
.amounts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.amounts .chip{border:none;cursor:pointer;font-size:12px}
.reward-pub{background:var(--yellow);text-align:center;border:3px dashed var(--ink)}
.reward-pub .amount{font-family:var(--font-title);font-weight:800;font-size:36px;line-height:1.1;margin:4px 0}
.map{height:260px;border-radius:16px;overflow:hidden;margin-top:10px;border:2px solid var(--line);position:relative;isolation:isolate;background:var(--line)}
input[type=range]{width:100%;accent-color:var(--orange);margin-top:6px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<noscript>Necesitas activar JavaScript para usar TAGGY.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================
   TAGGY · app funcional (sin backend, datos en localStorage)
   Assets opcionales en la carpeta ./assets :
     logo.png   → logo naranja TAGGY
     perro.png  → ilustración del perrito
     gato.png   → ilustración del gatito
   Si no existen, se usa un respaldo (texto/emoji).
   ========================================================= */
const ASSETS = { logo:'assets/logo.png', perro:'assets/perro.png', gato:'assets/gato.png' };

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

/* ---------- Estado + almacenamiento ---------- */
const KEY = 'taggy_v2';
let S = load();
let filter = 'all', draftTraits = [], draftPhoto = '', PUB = null;

function seed(){
  return {
    active:'TG-9204', baseUrl:'',
    pets:[{
      id:'TG-9204', name:'Dember', species:'perro', breed:'Shih Tzu', sex:'M', birth:'2025-05-14',
      sterilized:true, photo:'', lost:false, reward:{on:false, amount:5000, msg:''},
      traits:['Amigable','Juguetón','Teme a pirotecnia','Sociable con perros'],
      records:[
        {id:'r1', type:'alert',   title:'Alergia Severa a la Penicilina', date:'2024-10-12', notes:'Reacción anafiláctica previa reportada. No suministrar derivados de betalactámicos ni amoxicilina bajo ninguna circunstancia médica.'},
        {id:'r2', type:'consult', title:'Visita y Chequeo Anual', date:'2024-10-12', clinic:'Hospital Veterinario del Norte', notes:''},
        {id:'r3', type:'vaccine', title:'Vacuna Séxtuple Canina (DHPPi)', date:'2024-10-12', notes:'Dosis 2024-2025 aplicada vía subcutánea interescapular. Tolera sin reacciones adversas locales.', lote:'#VT-8821P', lab:'Zoetis Vanguard', until:'2025-10-12'}
      ]
    }],
    tutor:{name:'Valentina Palomino', phone:'9991234567', email:'vale.palo@gmail.com', city:'Mérida, Yucatán', zone:'Fracc. Los Héroes', hideAddress:false, geo:null, cotutor:{name:'Juanito Alcachofas', phone:'9999876543'}}
  };
}
function normalize(d){
  d.pets.forEach(p=>{ p.reward = p.reward || {on:false, amount:5000, msg:''}; p.records = p.records || []; p.traits = p.traits || []; });
  d.tutor = d.tutor || {};
  if(d.tutor.geo === undefined) d.tutor.geo = null;
  return d;
}
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.pets)) return normalize(d); }catch(e){}
  return seed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('No se pudo guardar: almacenamiento lleno (prueba con una foto más ligera)'); }
}
const cur = () => S.pets.find(p => p.id === S.active) || S.pets[0] || null;

/* ---------- Utilidades ---------- */
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const SPECIES = {perro:{label:'Perro', emoji:'🐶'}, gato:{label:'Gato', emoji:'🐱'}, otro:{label:'Mascota', emoji:'🐾'}};
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${+d} ${MESES[+m-1]} ${y}`; }
function fmtMonth(iso){ if(!iso) return ''; const [y,m]=iso.split('-'); return `${MESES[+m-1]} ${y}`; }
function age(b){
  if(!b) return '—';
  const d=new Date(b+'T00:00:00'), n=new Date();
  let m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth();
  if(n.getDate()<d.getDate()) m--;
  if(m<0) return '—';
  if(m<1) return 'Recién nacido';
  if(m<12) return m+(m===1?' mes':' meses');
  const y=Math.floor(m/12); return y+(y===1?' año':' años');
}
const digits = s => String(s||'').replace(/\D/g,'').slice(-10);
function fmtPhone(s){ const d=digits(s); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d; }
const todayISO = () => new Date().toISOString().slice(0,10);
const newId = () => 'r'+Math.random().toString(36).slice(2,8);

function toast(msg){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function modal(html){
  closeModal();
  const m=document.createElement('div'); m.className='overlay';
  m.innerHTML=`<div class="sheet" role="dialog">${html}</div>`;
  m.addEventListener('mousedown', e=>{ if(e.target===m) closeModal(); });
  document.body.appendChild(m); return m;
}
const closeModal = () => $$('.overlay').forEach(o=>o.remove());
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function confirmBox(msg, ok='Confirmar', danger=false){
  return new Promise(res=>{
    const m=modal(`<h3>${esc(msg)}</h3><div class="row"><button class="btn ghost" data-r="0">Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(ok)}</button></div>`);
    m.addEventListener('click', e=>{ const b=e.target.closest('[data-r]'); if(b){ closeModal(); res(b.dataset.r==='1'); } });
  });
}
function fieldErr(el, msg){ el.classList.add('err'); el.focus(); toast(msg); el.addEventListener('input',()=>el.classList.remove('err'),{once:true}); return false; }

/* ---------- Imágenes de marca (con respaldo) ---------- */
const logo = () => `<img class="logo" src="${ASSETS.logo}" alt="TAGGY" onerror="this.outerHTML='<span class=&quot;logo-text&quot;>TAGGY</span>'">`;
function petAv(p, size='lg'){
  if(p.photo) return `<div class="pet-av ${size}"><img src="${p.photo}" alt="${esc(p.name)}"></div>`;
  const sp = SPECIES[p.species] || SPECIES.otro;
  const src = ASSETS[p.species];

function emptyArt(species='perro'){

/* ---------- Datos públicos codificados en la URL (funciona sin servidor) ---------- */
function pubData(p){
  const t=S.tutor;
  return {
    i:p.id, n:p.name, s:p.species, b:p.breed, d:p.birth, x:p.sex, e:p.sterilized?1:0, t:p.traits, l:p.lost?1:0,
    a:p.records.filter(r=>r.type==='alert').map(r=>({t:(r.title||'').slice(0,60), n:(r.notes||'').slice(0,140)})),
    tn:t.name, tp:digits(t.phone), te:t.email, cn:t.cotutor?.name||'', cp:digits(t.cotutor?.phone),
    z: t.hideAddress ? t.zone : [t.zone,t.city].filter(Boolean).join(', '),
    rw: p.reward?.on ? Math.round(p.reward.amount||0) : 0,
    rm: (p.reward?.msg||'').slice(0,100),
    /* Zona: solo se publica un círculo aproximado, nunca un pin de la casa.
       Con "ocultar dirección" se redondean las coordenadas (~1 km) y el radio mínimo es 800 m. */
    g: t.geo ? (t.hideAddress ? [+t.geo.lat.toFixed(2), +t.geo.lng.toFixed(2), Math.max(t.geo.r,800)]
                              : [+t.geo.lat.toFixed(4), +t.geo.lng.toFixed(4), t.geo.r]) : null
  };
}
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function b64d(s){ try{ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
const baseUrl = () => (S.baseUrl || location.href.split('#')[0]).trim();
const publicUrl = p => baseUrl() + '#/p/' + b64e(pubData(p));

/* ---------- NFC / QR ---------- */
async function nfcWrite(){
  const p=cur(); if(!p) return;
  const note=$('#nfcNote');
  if(!('NDEFReader' in window)){ nfcModal(); toast('Este navegador no soporta NFC. Usa el QR o el enlace.'); return; }
  try{
    note.textContent='📡 Acerca el collar al dorso del celular…';
    const r=new NDEFReader();
    await r.write({records:[{recordType:'url', data:publicUrl(p)}]});
    note.textContent='✓ ¡Collar enlazado con '+(p.name||'tu mascota')+'!';
    toast('¡Collar TAGGY enlazado!');
  }catch(e){
    note.textContent = e.name==='NotAllowedError' ? 'Permiso de NFC denegado' : 'No se pudo escribir: '+e.message;
  }
}
function nfcModal(){
  const p=cur(); if(!p) return;
  const url=publicUrl(p);
  const local = /^(file:|http:\/\/(localhost|127))/.test(baseUrl());
  const m=modal(`
    <h3>Ficha del collar · ${esc(p.name)}</h3>
    <p class="sub">Cualquiera que escanee este QR (o toque la placa NFC) verá el perfil público y podrá avisarte.</p>
    <div class="qr" id="qrBox"></div>
    <label style="margin-top:4px">URL base donde publicaste TAGGY</label>
    <input class="input" id="baseUrl" placeholder="https://tuusuario.github.io/taggy/" value="${esc(S.baseUrl)}">
    ${local ? `<p class="info" style="text-align:left">⚠ Ahorita la app corre en tu computadora (${esc(location.protocol)}). Para que el QR/NFC funcione en otros celulares, publícala en https (GitHub Pages, Netlify…) y pega aquí su URL.</p>`:''}
    <p class="info" style="text-align:left">Largo del enlace: ${url.length} caracteres${url.length>850?' · ⚠ muy largo para algunas placas NFC (usa NTAG216) — acorta alertas o rasgos':''}.</p>
    <div class="row"><button class="btn ghost" data-act="copy-link">Copiar enlace</button><button class="btn primary" data-act="view-public">Ver placa</button></div>`);
  drawQR(url);
  $('#baseUrl',m).addEventListener('change', e=>{ S.baseUrl=e.target.value.trim(); save(); drawQR(publicUrl(p)); toast('URL base guardada'); });
}
function drawQR(url){
  const box=$('#qrBox'); if(!box) return; box.innerHTML='';
  if(typeof QRCode==='undefined'){ box.innerHTML='<p class="sub">No se pudo cargar el generador de QR (revisa tu conexión). Usa "Copiar enlace".</p>'; return; }
  try{ new QRCode(box,{text:url,width:240,height:240,colorDark:'#231f20',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.L}); }
  catch(e){ box.innerHTML='<p class="sub">El enlace es demasiado largo para un QR. Reduce rasgos/alertas.</p>'; }
}
async function copyLink(){
  const url=publicUrl(cur());
  try{ await navigator.clipboard.writeText(url); toast('Enlace copiado ✓'); }
  catch(e){ prompt('Copia este enlace:', url); }
}
async function sharePet(){
  const p=cur(); const url=publicUrl(p);
  if(navigator.share){ try{ await navigator.share({title:'TAGGY · '+p.name, text:'Perfil de '+p.name, url}); return; }catch(e){ if(e.name==='AbortError') return; } }
  copyLink();
}

function resizeImage(file, max=420){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const img=new Image(); img.onerror=rej;
      img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); };
      img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

    <div class="two"><div><label style="margin-top:0">Ciudad / Estado</label><input class="input" id="tCity" value="${esc(t.city)}"></div><div><label style="margin-top:0">Colonia / Zona</label><input class="input" id="tZone" value="${esc(t.zone)}"></div></div>

  <button class="btn primary" data-act="save-tutor">✔ Guardar Datos del Dueño</button>

  <div class="info" style="margin-top:18px">Respaldo de tus datos</div>

  <input type="file" id="importIn" accept="application/json" hidden>`;
}
function saveTutor(){
  const name=$('#tName'), phone=$('#tPhone'), email=$('#tEmail');
  if(!name.value.trim()) return fieldErr(name,'Escribe tu nombre');
  if(digits(phone.value).length!==10) return fieldErr(phone,'El teléfono debe tener 10 dígitos');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) return fieldErr(email,'Correo no válido');
  Object.assign(S.tutor,{name:name.value.trim(), phone:digits(phone.value), email:email.value.trim(), city:$('#tCity').value.trim(), zone:$('#tZone').value.trim(), hideAddress:$('#tHide').classList.contains('on'), geo:draftGeo});
  save(); toast('✓ Datos del dueño guardados'); route();
}
function cotutorModal(){
  const co=S.tutor.cotutor||{};
  const m=modal(`<h3>Co-Tutor de respaldo</h3>
    <form id="coForm" novalidate>

      <label>Teléfono (10 dígitos) *</label><input class="input" id="cPhone" type="tel" inputmode="tel" value="${esc(fmtPhone(co.phone))}">
      <div class="row"><button type="button" class="btn ghost" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div>
    </form>`);
  $('#coForm',m).addEventListener('submit',e=>{
    e.preventDefault();
    const n=$('#cName',m), ph=$('#cPhone',m);
    if(!n.value.trim()) return fieldErr(n,'Escribe el nombre');
    if(digits(ph.value).length!==10) return fieldErr(ph,'El teléfono debe tener 10 dígitos');
    S.tutor.cotutor={name:n.value.trim(), phone:digits(ph.value)}; save(); closeModal(); toast('Co-tutor guardado ✓'); route();
  });
}

      <div class="card"><div class="sec-title">📞 Contactar a mi familia</div>

          ${d.te?`<a class="btn blue" href="mailto:${esc(d.te)}?subject=${encodeURIComponent('Encontré a '+d.n)}">✉️ Enviar correo</a>`:''}

}

/* =========================================================
   MAPA DE ZONA (Leaflet + OpenStreetMap) y ubicación en vivo
   ========================================================= */
let zoneMap=null, zoneLayer=null, zoneDot=null, pubMap=null, watchId=null, liveDot=null, draftGeo=null;
const DEFAULT_CENTER=[20.9674,-89.5926]; // Mérida, Yuc.

function destroyMaps(){
  if(watchId!==null){ navigator.geolocation?.clearWatch(watchId); watchId=null; }
  if(zoneMap){ zoneMap.remove(); zoneMap=null; }
  if(pubMap){ pubMap.remove(); pubMap=null; }
  zoneLayer=zoneDot=liveDot=null;
}
function dist(a,b){ // metros (haversine)
  const R=6371000, t=x=>x*Math.PI/180, dLa=t(b[0]-a[0]), dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2 + Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m => m<1000 ? (Math.round(m/10)*10)+' m' : (m/1000).toFixed(1)+' km';
function baseMap(el, center, zoom){
  const m=L.map(el).setView(center,zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(m);
  setTimeout(()=>m.invalidateSize(),150);
  return m;
}
const ZONE_STYLE={color:'#e38b70', weight:3, fillColor:'#e38b70', fillOpacity:.28};

/* --- Mapa del tutor: marcar dónde vive normalmente --- */
function zoneBlock(t){
  const g=t.geo;
  return `<label>📍 Zona donde normalmente vive <span class="sub">(toca el mapa para marcarla)</span></label>
  <div class="add-row"><input class="input" id="zoneQ" placeholder="Buscar colonia o dirección…"><button type="button" class="mini-btn" style="background:var(--yellow);padding:0 14px" data-act="zone-search">Buscar</button></div>
  <div id="zoneMap" class="map"></div>
  <div class="between" style="margin-top:10px"><span class="sub">Radio de la zona</span><b id="zoneRTxt">${fmtDist(g?g.r:500)}</b></div>
  <input type="range" id="zoneR" min="150" max="3000" step="50" value="${g?g.r:500}">
  <div class="row" style="margin-top:10px">
    <button type="button" class="btn blue" style="padding:10px;font-size:12px" data-act="zone-here">📍 Usar mi ubicación</button>
    <button type="button" class="btn ghost" style="padding:10px;font-size:12px" data-act="zone-live">📡 Ver en vivo</button>
  </div>
  <p class="info" id="zoneInfo" style="text-align:left">${g?'':'Aún no has marcado la zona. '}Quien escanee la placa verá este círculo (no tu casa exacta) y qué tan lejos está de él, en tiempo real.</p>`;
}
function initZoneMap(){
  draftGeo = S.tutor.geo ? {...S.tutor.geo} : null;
  const el=$('#zoneMap'); if(!el) return;
  if(typeof L==='undefined'){ el.innerHTML='<div class="empty">No se pudo cargar el mapa (revisa tu conexión).</div>'; return; }
  zoneMap=baseMap(el, draftGeo?[draftGeo.lat,draftGeo.lng]:DEFAULT_CENTER, draftGeo?15:12);
  zoneMap.on('click', e=>setZone(e.latlng.lat, e.latlng.lng));
  paintZone(true);
}
function setZone(lat,lng){ const r=draftGeo?.r || +$('#zoneR')?.value || 500; draftGeo={lat,lng,r}; paintZone(false); }
function paintZone(fit){
  if(!zoneMap) return;
  if(zoneLayer){ zoneMap.removeLayer(zoneLayer); zoneLayer=null; }
  if(zoneDot){ zoneMap.removeLayer(zoneDot); zoneDot=null; }
  if(!draftGeo) return;
  const ll=[draftGeo.lat,draftGeo.lng];
  zoneLayer=L.circle(ll,{...ZONE_STYLE, radius:draftGeo.r}).addTo(zoneMap);
  zoneDot=L.circleMarker(ll,{radius:7,color:'#fff',weight:3,fillColor:'#f09200',fillOpacity:1}).addTo(zoneMap);
  if(fit) zoneMap.fitBounds(zoneLayer.getBounds(),{maxZoom:16,padding:[20,20]});
}

/* --- Seguimiento en vivo (watchPosition) --- */
function toggleLive(map, btn, onPos){
  if(watchId!==null){ stopLive(map,btn); return; }
  if(!navigator.geolocation){ toast('Tu dispositivo no permite ubicación'); return; }
  btn.dataset.off = btn.dataset.off || btn.textContent;
  btn.textContent='⏹ Detener';
  let first=true;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(!liveDot) liveDot=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2f80ed',fillOpacity:1}).addTo(map); else liveDot.setLatLng(ll);
    onPos(ll, first);
    first=false;
  }, err=>{ toast(err.code===1?'Permiso de ubicación denegado':'No pude obtener tu ubicación'); stopLive(map,btn); },
  {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
}
function stopLive(map,btn){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(liveDot && map){ map.removeLayer(liveDot); }
  liveDot=null;
  if(btn && btn.dataset.off) btn.textContent=btn.dataset.off;
}

/* --- Mapa en la placa pública: zona + posición en vivo de quien la escanea --- */
function pubMapCard(d){
  if(!d.g) return '';
  return `<div class="card"><div class="sec-title">📍 Zona donde vive ${esc(d.n)}</div>
    <div id="pubMap" class="map"></div>
    <p class="sub" id="pubInfo" style="margin:10px 0">Este círculo marca la zona aproximada donde ${esc(d.n)} suele estar. Activa tu ubicación para ver qué tan cerca estás.</p>
    <button class="btn blue" data-act="pub-live">📡 Ver mi ubicación en vivo</button></div>`;
}
function initPubMap(){
  if(!PUB?.g) return;
  const el=$('#pubMap'); if(!el) return;
  if(typeof L==='undefined'){ el.innerHTML='<div class="empty">No se pudo cargar el mapa.</div>'; return; }
  const [lat,lng,r]=PUB.g;
  pubMap=baseMap(el,[lat,lng],14);
  const c=L.circle([lat,lng],{...ZONE_STYLE, radius:r}).addTo(pubMap);
  pubMap.fitBounds(c.getBounds(),{maxZoom:16,padding:[20,20]});
}

function sendLocation(){
  if(!PUB?.tp){ toast('Esta placa no tiene teléfono'); return; }
  if(!navigator.geolocation){ toast('Tu dispositivo no permite compartir ubicación'); return; }
  toast('Obteniendo ubicación…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:la, longitude:lo}=pos.coords;
    const msg=`Hola, encontré a ${PUB.n} (placa TAGGY). Estoy aquí: https://maps.google.com/?q=${la},${lo}`;
    window.open(`https://wa.me/52${PUB.tp}?text=${encodeURIComponent(msg)}`,'_blank');
  }, ()=>toast('No pude obtener tu ubicación. Activa el permiso e inténtalo otra vez.'), {enableHighAccuracy:true, timeout:12000});
}

/* =========================================================
   EVENTOS GLOBALES
   ========================================================= */
document.addEventListener('click', async e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const sw=e.target.closest('[data-switch]'); if(sw){ sw.classList.toggle('on'); return; }
  const sg=e.target.closest('[data-single] > button'); if(sg){ $$('button',sg.parentElement).forEach(b=>b.classList.remove('on')); sg.classList.add('on'); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const id=a.dataset.id, p=cur();
  switch(a.dataset.act){
    case 'close-modal': closeModal(); break;
    case 'pick-pet': S.active=id; save(); route(); break;
    case 'new-pet': {
      const nid='TG-'+Math.floor(1000+Math.random()*9000);
      S.pets.push({id:nid,name:'',species:'perro',breed:'',sex:'M',birth:'',sterilized:false,photo:'',traits:[],lost:false,reward:{on:false,amount:5000,msg:''},records:[]});
      S.active=nid; save(); go('#/edit/pet'); break; }
    case 'toggle-lost':
      p.lost=!p.lost; save(); route();
      toast(p.lost?'⚠ Modo perdido activado: la placa lo mostrará':'✓ Qué alivio, modo perdido desactivado'); break;
    case 'toggle-reward': p.reward=p.reward||{on:false,amount:5000,msg:''}; p.reward.on=!p.reward.on; save(); route(); break;
    case 'rw-amt': p.reward.amount=+id; save(); route(); break;
    case 'zone-here':
      if(!navigator.geolocation){ toast('Tu dispositivo no permite ubicación'); break; }
      toast('Buscando tu ubicación…');
      navigator.geolocation.getCurrentPosition(pos=>{ setZone(pos.coords.latitude,pos.coords.longitude); paintZone(true); toast('Zona marcada en tu ubicación ✓ (recuerda guardar)'); },
        ()=>toast('No pude obtener tu ubicación. Activa el permiso.'), {enableHighAccuracy:true, timeout:12000});
      break;
    case 'zone-search': {
      const q=$('#zoneQ').value.trim();
      if(!q){ toast('Escribe una colonia o dirección'); break; }
      try{
        const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q='+encodeURIComponent(q));
        const j=await res.json();
        if(!j[0]){ toast('No encontré ese lugar'); break; }
        setZone(+j[0].lat,+j[0].lon); paintZone(true);
      }catch(err){ toast('No pude buscar ahora. Toca el mapa para marcar la zona.'); }
      break; }
    case 'zone-live':
      if(!zoneMap){ toast('El mapa no está disponible'); break; }
      toggleLive(zoneMap, a, (ll,first)=>{
        if(draftGeo){
          const d=dist(ll,[draftGeo.lat,draftGeo.lng]);
          $('#zoneInfo').textContent = `📡 Tu posición en vivo: a ${fmtDist(d)} del centro de la zona${d<=draftGeo.r?' (dentro ✓)':''}.`;
          if(first) zoneMap.fitBounds(L.latLngBounds([ll,[draftGeo.lat,draftGeo.lng]]).pad(.3));
        } else if(first){ zoneMap.setView(ll,16); $('#zoneInfo').textContent='📡 Tu posición en vivo (punto azul). Toca el mapa para marcar la zona.'; }
      }); break;
    case 'pub-live':
      if(!pubMap){ toast('El mapa no está disponible'); break; }
      toggleLive(pubMap, a, (ll,first)=>{
        const [lat,lng,r]=PUB.g, d=dist(ll,[lat,lng]), out=Math.max(0,d-r);
        $('#pubInfo').innerHTML = out===0 ? `🏡 Estás <b>dentro</b> de la zona habitual de ${esc(PUB.n)}. Probablemente vive muy cerca.` : `Estás a <b>${fmtDist(out)}</b> de la zona habitual de ${esc(PUB.n)}.`;
        if(first) pubMap.fitBounds(L.latLngBounds([ll,[lat,lng]]).pad(.4));
      }); break;
    case 'add-record': recordModal(); break;
    case 'edit-record': recordModal(id); break;
    case 'del-record': if(await confirmBox('¿Borrar este registro de salud?','Borrar',true)){ p.records=p.records.filter(r=>r.id!==id); save(); route(); toast('Registro borrado'); } break;
    case 'filter': filter=id; route(); break;
    case 'nfc-card': nfcModal(); break;
    case 'nfc-write': nfcWrite(); break;
    case 'copy-link': copyLink(); break;
    case 'share': sharePet(); break;
    case 'view-public': closeModal(); go('#/p/'+b64e(pubData(p))); break;
    case 'send-location': sendLocation(); break;
    case 'add-trait': { const i=$('#traitIn'), v=i.value.trim(); if(!v) return; if(draftTraits.length>=10) return toast('Máximo 10 etiquetas'); if(!draftTraits.includes(v)) draftTraits.push(v); i.value=''; paintTraits(); break; }
    case 'rm-trait': draftTraits.splice(+id,1); paintTraits(); break;
    case 'rm-photo': draftPhoto=''; p.photo=''; save(); route(); break;
    case 'save-pet': savePet(); break;
    case 'del-pet':
      if(await confirmBox(`¿Dar de baja a ${p.name||'esta mascota'}? Se borrarán sus datos y su historial de salud.`,'Dar de baja',true)){
        S.pets=S.pets.filter(x=>x.id!==p.id); S.active=S.pets[0]?.id||''; save(); toast('Mascota dada de baja'); go('#/pets');
      } break;
    case 'save-tutor': saveTutor(); break;
    case 'edit-cotutor': cotutorModal(); break;
    case 'rm-cotutor': if(await confirmBox('¿Quitar al co-tutor de respaldo?','Quitar',true)){ S.tutor.cotutor=null; save(); route(); } break;
    case 'export': {
      const url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
      const l=document.createElement('a'); l.href=url; l.download='taggy-respaldo.json'; l.click(); URL.revokeObjectURL(url); toast('Respaldo descargado ✓'); break; }
    case 'import': $('#importIn').click(); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='traitIn'){ e.preventDefault(); $('[data-act="add-trait"]').click(); }
  if(e.key==='Enter' && e.target.id==='zoneQ'){ e.preventDefault(); $('[data-act="zone-search"]').click(); }
});
document.addEventListener('input', e=>{
  if(e.target.id==='rwAmount'){ cur().reward.amount=Math.max(0,Math.min(10000000,Math.round(+e.target.value||0))); save(); }
  if(e.target.id==='rwMsg'){ cur().reward.msg=e.target.value.slice(0,100); save(); }
  if(e.target.id==='zoneR'){ const r=+e.target.value; $('#zoneRTxt').textContent=fmtDist(r); if(draftGeo){ draftGeo.r=r; paintZone(false); } }
  if(e.target.id==='fBirth') $('#ageHint').textContent = e.target.value ? '· '+age(e.target.value) : '';
  if(e.target.id==='tPhone' || e.target.id==='cPhone'){ const d=digits(e.target.value); e.target.value = d.length===10 ? fmtPhone(d) : d; }
});
document.addEventListener('change', async e=>{
  if(e.target.id==='photoIn' && e.target.files[0]){
    try{ draftPhoto=await resizeImage(e.target.files[0]); $('#photoSlot').innerHTML=petAv({name:'',species:cur().species,photo:draftPhoto},'md'); toast('Foto lista · recuerda guardar'); }
    catch(err){ toast('No pude leer esa imagen'); }
  }
  if(e.target.id==='importIn' && e.target.files[0]){
    try{
      const d=JSON.parse(await e.target.files[0].text());
      if(!Array.isArray(d.pets)||!d.tutor) throw 0;
      if(!await confirmBox('Esto reemplazará todos tus datos actuales. ¿Continuar?','Importar')) return;
      S=normalize(d); save(); toast('Respaldo importado ✓'); go('#/pets');
    }catch(err){ toast('Ese archivo no es un respaldo válido de TAGGY'); }
  }
});

route();
</script>
